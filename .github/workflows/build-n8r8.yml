name: Build Xiaozhi for ESP32-S3-N8R8

on:
  workflow_dispatch:   # 手机可手动触发
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build bread-compact-wifi-n8r8 (8MB)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout this repo (board overlay)
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Clone upstream xiaozhi-esp32 v2.5.0
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/78/xiaozhi-esp32.git upstream

      - name: Overlay N8R8 board source
        run: |
          set -e
          SRC=patch-repo/boards/bread-compact-wifi-n8r8
          DST=upstream/main/boards/bread-compact-wifi
          echo "=== overlay board files ==="
          ls -la "$SRC"
          cp "$SRC/config.json" "$DST/config.json"
          cp "$SRC/config.h" "$DST/config.h"
          cp "$SRC/compact_wifi_board.cc" "$DST/compact_wifi_board.cc"
          echo "=== config.json after overlay ==="
          cat "$DST/config.json"

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          cd upstream
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi-n8r8

      - name: List build outputs
        if: always()
        run: |
          echo "=== build dir ==="
          ls -lh upstream/build/ 2>/dev/null || true
          echo "=== releases ==="
          ls -lh upstream/releases/ 2>/dev/null || true
          echo "=== sdkconfig flash/partition ==="
          grep -E 'FLASHSIZE|PARTITION_TABLE' upstream/sdkconfig 2>/dev/null || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-v2.5.0-bread-compact-wifi-n8r8
          path: |
            upstream/build/merged-binary.bin
            upstream/releases/*.zip
          if-no-files-found: error
