name: Build Xiaozhi for ESP32-S3-N8R8

on:
  workflow_dispatch:   # 手机可手动触发
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build bread-compact-wifi (8MB)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout this repo (patch script)
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Clone upstream xiaozhi-esp32 v2.5.0
        run: |
          git clone --depth 1 --branch v2.5.0 https://github.com/78/xiaozhi-esp32.git upstream

      - name: Apply 8MB Flash patch
        run: |
          cp patch-repo/scripts/patch_config.py upstream/
          cd upstream
          python3 patch_config.py

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          cd upstream
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi-n8r8

      - name: List build outputs
        run: |
          echo "=== build dir ==="
          ls -lh upstream/build/ || true
          echo "=== releases ==="
          ls -lh upstream/releases/ || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-v2.5.0-bread-compact-wifi-n8r8
          path: |
            upstream/build/merged-binary.bin
            upstream/releases/*.zip
          if-no-files-found: error
